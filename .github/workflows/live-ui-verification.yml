name: Verify live Oryveta UI
on:
  push:
    branches: ['ci/preflight-live-ui-verification']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production HTML and assets over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 2 --max-time 20 --fail -sSL https://oryveta.vercel.app/ -o /tmp/index.html
          grep -q 'id="app"' /tmp/index.html
          grep -q '/static/app.js' /tmp/index.html
          grep -q '/static/styles.css' /tmp/index.html
          curl --max-time 20 --fail -sSL https://oryveta.vercel.app/static/app.js -o /tmp/app.js
          curl --max-time 20 --fail -sSL https://oryveta.vercel.app/static/styles.css -o /tmp/styles.css
          grep -q 'async function init' /tmp/app.js
          grep -q '.sidebar' /tmp/styles.css
          echo "PASS production HTTP: real apps/web HTML, JavaScript and CSS served"
      - name: Install browser test tooling
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install chromium
      - name: Render production UI on desktop and mobile
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              for label, viewport in (("desktop", {"width": 1440, "height": 900}), ("mobile", {"width": 390, "height": 844})):
                  page = browser.new_page(viewport=viewport)
                  errors = []
                  page.on("pageerror", lambda e: errors.append(str(e)))
                  response = page.goto("https://oryveta.vercel.app/", wait_until="networkidle", timeout=45000)
                  assert response.status == 200
                  assert page.locator("#app").is_visible(), (label, errors)
                  assert page.locator("#page h1").inner_text() == "Good software gets better."
                  assert "public UI preview" in page.locator("#page").inner_text()
                  assert page.evaluate("document.styleSheets.length") >= 1
                  if label == "mobile":
                      page.locator("#mobile-menu").click()
                      assert page.locator("#nav").is_visible()
                  page.locator('#nav [data-page="new"]').click()
                  assert page.locator("#page h1").inner_text() == "From idea to repository."
                  if label == "mobile":
                      page.locator("#mobile-menu").click()
                  page.locator('#nav [data-page="evolve"]').click()
                  assert page.locator("#page h1").inner_text() == "Great software never stands still."
                  assert not errors, (label, errors)
                  print(f"PASS live production {label}: real UI visible, navigation works, no JS errors")
                  page.close()
              browser.close()
          PY
