name: Verify auth preview over HTTPS
on:
  push:
    branches: [ci/auth-preview-live-check]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check deployed sign-in HTML and assets
        run: |
          set -euo pipefail
          ROOT=https://oryveta.vercel.app
          curl --max-time 20 -fsSL "$ROOT/" -o /tmp/index.html
          grep -q 'id="github-login"' /tmp/index.html
          grep -q 'id="preview-login"' /tmp/index.html
          for file in app.js styles.css cloud-config.js cloud-auth.js; do
            curl --max-time 20 -fsSL "$ROOT/static/$file" -o "/tmp/$file"
            test -s "/tmp/$file"
          done
          echo "PASS hosted sign-in HTML, CSS, app JS and auth adapters over HTTPS"
      - name: Install Chromium
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install chromium
      - name: Verify rendered sign-in and preview on desktop/mobile
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          url="https://oryveta.vercel.app/"
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for label,viewport in (("desktop",{"width":1440,"height":900}),("mobile",{"width":390,"height":844})):
                  page=browser.new_page(viewport=viewport)
                  errors=[]
                  page.on("pageerror",lambda e:errors.append(str(e)))
                  response=page.goto(url,wait_until="networkidle",timeout=45000)
                  assert response.status==200
                  assert page.locator("#login").is_visible()
                  assert page.locator("#preview-login").is_visible()
                  assert page.locator("#github-login").is_hidden()
                  assert page.locator("#login h1").inner_text().startswith("Build with clarity.")
                  page.locator("#preview-login").click()
                  assert page.locator("#page h1").inner_text()=="Good software gets better."
                  if label=="mobile":
                      page.locator("#mobile-menu").click()
                  page.locator('#nav [data-page="workspace"]').click()
                  assert page.locator("#page h1").inner_text()=="Your company starts here."
                  assert not errors,(label,errors)
                  print("PASS hosted "+label+": sign-in, explicit guest preview and workspace")
                  page.close()
              browser.close()
          PY
