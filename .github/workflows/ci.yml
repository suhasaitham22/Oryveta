name: CI

on:
  pull_request:
  push:
    branches: [main, 'ci/preflight-*']
  schedule:
    - cron: '13 8 * * 1' # Recheck dependencies even without new commits.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Lint Python
        run: ruff check apps/api engine tests
      - name: Check Python compilation and dependencies
        run: |
          python -m compileall -q apps/api engine tests
          python -m pip check
      - name: Check browser JavaScript syntax
        run: node --check apps/web/app.js

  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Run isolated tests with branch coverage gate
        run: >-
          python -m pytest -q
          --cov=oryveta_api --cov=oryveta_engine
          --cov-branch --cov-report=term-missing
          --cov-fail-under=84
      - name: Verify distributable wheel
        if: matrix.python-version == '3.12'
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/oryveta-wheels .
          python -m pip install --force-reinstall --no-deps /tmp/oryveta-wheels/*.whl
          python -c 'import oryveta_api, oryveta_engine; print("Wheel import OK")'

  security:
    name: Dependency and source security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install app and security scanners
        run: python -m pip install . 'pip-audit>=2.7,<3' 'bandit>=1.7,<2'
      - name: Fail on known vulnerable installed dependencies
        run: |
          # Audit the resolved, installed dependency versions, not the local
          # unpublished Oryveta distribution (which has no PyPI advisory ID).
          # Never silently ignore a known vulnerability or scanner failure.
          python -m pip freeze | grep -viE '^oryveta([[:space:]]|=|@)' > /tmp/oryveta-audit.txt
          ! grep -qiE '^oryveta([[:space:]]|=|@)' /tmp/oryveta-audit.txt
          python -m pip_audit --strict --no-deps -r /tmp/oryveta-audit.txt
      - name: Fail on medium/high-confidence security findings
        run: bandit -q -r apps/api/oryveta_api engine/oryveta_engine -ll -ii

  container:
    name: Docker build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build deployable image
        run: docker build --tag oryveta-ci:local .
      - name: Verify non-root runtime and importable API
        run: |
          docker run --rm --entrypoint python oryveta-ci:local -c '
          import os
          from oryveta_api.main import app
          assert os.geteuid() != 0
          assert app.title == "Oryveta API"
          print("Non-root container smoke OK")'
      - name: Validate single-host Compose configuration
        run: docker compose config --quiet
