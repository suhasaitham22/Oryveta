name: Browser UI smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: browser-ui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  browser:
    name: Desktop and mobile render
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned browser test dependency
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install chromium
      - name: Render real frontend in desktop and mobile browsers
        run: python scripts/ui_smoke.py
