name: React Studio build and browser QA
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: react-studio-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  react-build:
    name: React/shadcn production build + accessible flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned direct dependencies (lockfile to be generated)
        working-directory: apps/web/studio
        run: npm install --no-audit --no-fund
      - name: Publish install dependency manifest for lockfile pinning (public metadata)
        working-directory: apps/web/studio
        run: |
          node -e 'const f=require("fs").readFileSync("package-lock.json").toString("base64");for(let i=0;i<f.length;i+=1800)console.log("ORYVETA_STUDIO_LOCK "+String(i/1800)+" "+f.slice(i,i+1800));'
      - name: Validate story contracts and browser auth boundary
        working-directory: apps/web/studio
        run: npm run check
      - name: Build React Vite product
        working-directory: apps/web/studio
        run: npm run build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # pinned
        with:
          python-version: '3.12'
      - name: Install Playwright browser
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install chromium
      - name: Test production-built frontend on desktop/mobile
        run: python scripts/react_ui_smoke.py
      - name: Validate vendored snapcn demo scene manifests
        working-directory: apps/web/studio/demo
        run: npm run check
      - name: Install & typecheck real Remotion + snapcn video components
        working-directory: apps/web/studio/demo
        run: |
          npm install --no-audit --no-fund
          node -e 'const f=require("fs").readFileSync("package-lock.json").toString("base64");for(let i=0;i<f.length;i+=1800)console.log("ORYVETA_DEMO_LOCK "+String(i/1800)+" "+f.slice(i,i+1800));'
          npx tsc --noEmit
