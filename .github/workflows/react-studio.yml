name: React Studio build and browser QA
on:
  pull_request:
  push:
    branches: [main, 'ci/preflight-*']
permissions:
  contents: read
concurrency:
  group: react-studio-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  react-build:
    name: React/shadcn production build + accessible flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked frontend dependencies
        working-directory: apps/web/studio
        run: npm ci --no-audit --no-fund
      - name: Validate story contracts and browser auth boundary
        working-directory: apps/web/studio
        run: npm run check
      - name: Build React Vite hosted product
        working-directory: apps/web/studio
        run: npm run build
      - name: Build React Vite self-hosted product
        working-directory: apps/web/studio
        run: npm run build:local
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # pinned
        with:
          python-version: '3.12'
      - name: Install Playwright browser
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install chromium
      - name: Test production-built frontend on desktop/mobile
        run: python scripts/react_ui_smoke.py
      - name: Exercise self-hosted local API and persisted job UI
        env:
          ORYVETA_BASE_URL: http://127.0.0.1:8789
          ORYVETA_LOCAL_DEMO: 'true'
          ORYVETA_DATABASE_PATH: ${{ runner.temp }}/oryveta-studio.db
          ORYVETA_WORKSPACE_ROOT: ${{ runner.temp }}/oryveta-studio-work
        run: |
          set -euo pipefail
          python -m pip install -e .
          uvicorn oryveta_api.main:app --host 127.0.0.1 --port 8789 >"${RUNNER_TEMP}/oryveta-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8789/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8789/api/health >/dev/null
          ORYVETA_SMOKE_API_URL=http://127.0.0.1:8789 python scripts/react_ui_smoke.py
      - name: Validate vendored snapcn demo scene manifests
        working-directory: apps/web/studio/demo
        run: npm run check
      - name: Install & typecheck real Remotion + snapcn video components
        working-directory: apps/web/studio/demo
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
  auth-integration:
    name: Real Supabase auth, RLS and browser collaboration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_EXPERIMENTAL_STACK: '1'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Set isolated Supabase state directory
        run: echo "SUPABASE_HOME=$RUNNER_TEMP/oryveta-auth-supabase" >> "$GITHUB_ENV"
      - name: Install locked frontend and browser dependencies
        run: |
          npm --prefix apps/web/studio ci --no-audit --no-fund
          python -m pip install 'httpx==0.28.1' 'playwright==1.64.1'
          python -m playwright install --with-deps chromium
      - name: Start isolated native Supabase services
        run: |
          umask 077
          npx --yes supabase@2.121.0 start --runtime native --eager --output-format json > "$RUNNER_TEMP/auth-connections.json"
      - name: Exercise SQL authorization and real email login in Chromium
        run: |
          python scripts/auth_ui_smoke.py --connections "$RUNNER_TEMP/auth-connections.json" --evidence "$RUNNER_TEMP/auth-evidence"
      - name: Exercise collaboration response-order races
        run: python scripts/collaboration_race_smoke.py --connections "$RUNNER_TEMP/auth-connections.json" --skip-sql --evidence "$RUNNER_TEMP/auth-evidence"
      - name: Exercise concurrent runtime transitions
        run: python scripts/factory_runtime_race_checks.py --connections "$RUNNER_TEMP/auth-connections.json" --skip-sql
      - name: Exercise the real repository worker
        run: python scripts/factory_runtime_smoke.py --connections "$RUNNER_TEMP/auth-connections.json" --skip-sql
      - name: Exercise browser-to-worker analysis
        run: python scripts/factory_runtime_ui_smoke.py --skip-sql --evidence "$RUNNER_TEMP/auth-evidence" < "$RUNNER_TEMP/auth-connections.json"
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: auth-browser-evidence
          path: ${{ runner.temp }}/auth-evidence
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove isolated test services
        if: always()
        run: npx --yes supabase@2.121.0 stack destroy --yes
