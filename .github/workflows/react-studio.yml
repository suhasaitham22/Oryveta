name: React Studio build and browser QA
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: react-studio-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  react-build:
    name: React/shadcn production build + accessible flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked frontend dependencies
        working-directory: apps/web/studio
        run: npm ci --no-audit --no-fund
      - name: Validate story contracts and browser auth boundary
        working-directory: apps/web/studio
        run: npm run check
      - name: Build React Vite product
        working-directory: apps/web/studio
        run: npm run build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # pinned
        with:
          python-version: '3.12'
      - name: Install Playwright browser
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install chromium
      - name: Test production-built frontend on desktop/mobile
        run: python scripts/react_ui_smoke.py
      - name: Exercise self-hosted local API and persisted job UI
        env:
          ORYVETA_BASE_URL: http://127.0.0.1:8789
          ORYVETA_LOCAL_DEMO: 'true'
          ORYVETA_DATABASE_PATH: ${{ runner.temp }}/oryveta-studio.db
          ORYVETA_WORKSPACE_ROOT: ${{ runner.temp }}/oryveta-studio-work
        run: |
          set -euo pipefail
          python -m pip install -e .
          uvicorn oryveta_api.main:app --host 127.0.0.1 --port 8789 >"${RUNNER_TEMP}/oryveta-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8789/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8789/api/health >/dev/null
          ORYVETA_SMOKE_API_URL=http://127.0.0.1:8789 python scripts/react_ui_smoke.py
      - name: Validate vendored snapcn demo scene manifests
        working-directory: apps/web/studio/demo
        run: npm run check
      - name: Install & typecheck real Remotion + snapcn video components
        working-directory: apps/web/studio/demo
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
