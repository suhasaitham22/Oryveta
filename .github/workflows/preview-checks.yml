name: Static preview checks
on:
  push:
    paths:
      - 'preview/**'
      - '.github/workflows/preview-checks.yml'
  pull_request:
    paths:
      - 'preview/**'
      - '.github/workflows/preview-checks.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify preview exists and avoids unsafe dependencies
        run: |
          test -f preview/index.html
          python - <<'PY'
          from pathlib import Path
          site = Path('preview/index.html').read_text(encoding='utf-8')
          for phrase in ['Start New', 'Evolve Existing', 'Interactive product preview', 'No sign-in required']:
              assert phrase in site, phrase
          assert '<script src="https://' not in site
          assert 'GitHub sign-in' in site
          print('Static preview checks passed')
          PY
